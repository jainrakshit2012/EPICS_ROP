# Default training configuration for the ROP classification pipeline.
# Override with: python train.py --config path/to/other.yaml

data_root: "."  # directory containing Neo_Normal/ Neo_ROP/ RetCam_Normal/ RetCam_ROP/
output_dir: "results"

image_size: 512
batch_size: 8
num_workers: 2

# Two-phase fine-tuning (see engine.py / train.py)
epochs_phase1: 5    # classifier head only, backbone frozen
epochs_phase2: 25   # full network, low LR
lr_phase1: 0.001
lr_phase2: 0.00001
weight_decay: 0.0001

# Evaluation splits
test_size: 0.15      # held out once, evaluated only at the very end
n_folds: 5            # stratified k-fold CV on the remaining train+val pool
final_val_size: 0.1   # slice of the trainval pool used only for LR scheduling/checkpointing in the final fit

seed: 42
